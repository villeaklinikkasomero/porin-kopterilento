<!doctype html><html><head><meta charset="utf-8"><title>Vesi – kokeilu</title>
<style>body{margin:0;background:#b4cfe4;overflow:hidden}#i{position:fixed;left:8px;top:8px;font:13px sans-serif;color:#123;background:#fffc;padding:4px 8px}</style></head><body><div id="i">Vesi-kokeilu: hiiri = kääntele, rulla = korkeus. ?vanha=1 = pelin nykyinen vesi</div>
<script type="module">
window.__vesiKokeilu = true;
import * as THREE from '../three.module.min.js';
import CITY from '../city.js'; import RIV from '../river.js'; import TER from '../terrain.js';
import { luoVesi } from './vesi.js';
const Q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb4cfe4); scene.fog = new THREE.FogExp2(0xb4cfe4, 0.00042);
const camera = new THREE.PerspectiveCamera(55, W / H, 0.5, 8000);
const HW = CITY.hw, YS = CITY.ys, YN = CITY.yn, YSPAN = YN - YS, OX0 = CITY.ox0, OX1 = CITY.ox1, OY0 = CITY.oy0, OY1 = CITY.oy1, OXS = OX1 - OX0, OYS = OY1 - OY0;
const dec = b => { const s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
const THG = new Int16Array(dec(TER.hg).buffer);
const TZg = (x, y) => { const fx = Math.min(TER.nx - 1.001, Math.max(0, (x - TER.x0) / TER.g)), fy = Math.min(TER.ny - 1.001, Math.max(0, (y - TER.y0) / TER.g)), i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j, k = j * TER.nx + i; return ((THG[k] * (1 - u) + THG[k + 1] * u) * (1 - v) + (THG[k + TER.nx] * (1 - u) + THG[k + TER.nx + 1] * u) * v) / 10; };
const inCore = (x, y) => Math.abs(x) < HW && y > YS && y < YN;
const L = new THREE.TextureLoader();
const ld = u => new Promise(r => L.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));
const [orto, outer] = await Promise.all([ld('../orto.jpg'), ld('../outer.jpg')]);
const cuv = (x, y) => [(x + HW) / (2 * HW), (y - YS) / YSPAN], ouv = (x, y) => [(x - OX0) / OXS, (y - OY0) / OYS];
const gridGeo = (x0, y0, x1, y1, step, uvf, skipf) => { const nx = Math.round((x1 - x0) / step), ny = Math.round((y1 - y0) / step), P = [], U = [], I = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) { const x = x0 + i * step, y = y0 + j * step; P.push(x, TZg(x, y), -y); U.push(...uvf(x, y)); }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const x = x0 + (i + 0.5) * step, y = y0 + (j + 0.5) * step; if (skipf && skipf(x, y)) continue; const k = j * (nx + 1) + i; I.push(k, k + 1, k + nx + 2, k, k + nx + 2, k + nx + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2)); g.setIndex(I); return g; };
scene.add(new THREE.Mesh(gridGeo(-HW, YS, HW, YN, 6, cuv), new THREE.MeshBasicMaterial({ map: orto })));
scene.add(new THREE.Mesh(gridGeo(OX0, OY0, OX1, OY1, 18, ouv, (x, y) => Math.abs(x) < HW - 9 && y > YS + 9 && y < YN - 9), new THREE.MeshBasicMaterial({ map: outer })));
const tris = (a, uvf, y) => { const p = [], u = []; for (let i = 0; i < a.length; i += 2) { p.push(a[i], y, -a[i + 1]); u.push(...uvf(a[i], a[i + 1])); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(u, 2)); return g; };
const grassTex = new THREE.DataTexture(new Uint8Array(64 * 64 * 4).map((_, i) => (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) * 127), 64, 64); grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.needsUpdate = true;
function waterify(mat) { mat.onBeforeCompile = sh => { sh.uniforms.grassTex = { value: grassTex };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vGw;').replace('#include <project_vertex>', '#include <project_vertex>\nvGw = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vGw; uniform sampler2D grassTex;').replace('#include <map_fragment>', `#include <map_fragment>
      { vec3 v = normalize(cameraPosition - vGw); float rip = texture2D(grassTex, vGw.xz * 0.05).r * 0.6 + texture2D(grassTex, vGw.xz * 0.013 + 0.5).r * 0.4;
        float fr = clamp(pow(1.0 - v.y, 3.0) * 0.85 + 0.18 + (rip - 0.5) * 0.12, 0.0, 0.92);
        vec3 sky = mix(vec3(0.30, 0.38, 0.46), vec3(0.62, 0.72, 0.84), 1.0 - v.y);
        diffuseColor.rgb = mix(diffuseColor.rgb * vec3(0.9, 1.0, 1.05) + 0.03, sky, fr); }`); }; mat.needsUpdate = true; return mat; }
{ const pc = [], po = [], A = RIV.water; for (let i = 0; i < A.length; i += 6) { const cx = (A[i] + A[i + 2] + A[i + 4]) / 3, cy = (A[i + 1] + A[i + 3] + A[i + 5]) / 3; (inCore(cx, cy) ? pc : po).push(...A.slice(i, i + 6)); }
  scene.add(new THREE.Mesh(tris(pc, cuv, TER.wl), waterify(new THREE.MeshBasicMaterial({ map: orto }))));
  scene.add(new THREE.Mesh(tris(po, ouv, TER.wl), waterify(new THREE.MeshBasicMaterial({ map: outer })))); }
let api = null; if (!Q.get('vanha')) api = luoVesi({ scene }); window.api = api;
let x = +(Q.get('x') ?? -8), y = +(Q.get('y') ?? 470), alt = +(Q.get('alt') ?? 3), yaw = +(Q.get('yaw') ?? 60) * Math.PI / 180, pit = +(Q.get('pit') ?? -8) * Math.PI / 180;
const t0 = +(Q.get('t') ?? -1);
function place() { camera.position.set(x, TER.wl + alt, -y); camera.lookAt(x + Math.sin(yaw) * Math.cos(pit) * 10, TER.wl + alt + Math.sin(pit) * 10, -y - Math.cos(yaw) * Math.cos(pit) * 10); }
let drag = null; addEventListener('mousedown', e => drag = [e.clientX, e.clientY]); addEventListener('mouseup', () => drag = null);
addEventListener('mousemove', e => { if (!drag) return; yaw += (e.clientX - drag[0]) * 0.005; pit = Math.max(-1.5, Math.min(0.5, pit - (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { alt = Math.max(1, alt * (e.deltaY > 0 ? 1.15 : 0.87)); });
addEventListener('keydown', e => { const s = Math.max(2, alt * 0.2); if (e.key === 'w') { x += Math.sin(yaw) * s; y += Math.cos(yaw) * s; } if (e.key === 's') { x -= Math.sin(yaw) * s; y -= Math.cos(yaw) * s; } });
if (t0 >= 0) { const now = performance.now; performance.now = () => t0 * 1000; }
function frame() { place(); renderer.render(scene, camera); if (t0 < 0) requestAnimationFrame(frame); }
place(); renderer.render(scene, camera); renderer.render(scene, camera); window.done = true; if (t0 < 0) requestAnimationFrame(frame);
</script></body></html>
