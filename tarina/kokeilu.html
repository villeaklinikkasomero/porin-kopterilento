<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Satamakaupunki – tehtävien kokeilu ilman peliä</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0e1620; color: #f4f1e8; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #ohje { position: fixed; left: 12px; bottom: 12px; z-index: 50; background: rgba(10,16,24,.86); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.7; }
  kbd { font: 700 11px ui-monospace, Menlo, Consolas, monospace; background: rgba(255,255,255,.1); border-radius: 4px; padding: 1px 5px; }
  #tila { position: fixed; right: 12px; bottom: 12px; z-index: 50; background: rgba(10,16,24,.86); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div id="ohje">
  <b>Kokeilutila</b> – tehtävämoottori ilman peliä (kartta ylhäältä, 1 ruutu = 50 m)<br>
  <kbd>←↑→↓</kbd>/<kbd>WASD</kbd> liiku · <kbd>Shift</kbd> nopeammin · <kbd>V</kbd> vaihda kulkuneuvo · <kbd>B</kbd> hajota kulkuneuvo<br>
  <kbd>X</kbd> toiminto · <kbd>1–3</kbd> valinta · <kbd>P</kbd> valikko · <kbd>Ctrl+Shift+D</kbd> kehittäjä (<kbd>O</kbd> ohita)
</div>
<div id="tila"></div>
<script type="module">
import * as THREE from '../three.module.min.js';

// --- pelin korvike: samat oliot, joita tarina/peli.js lukee oikeasta pelistä ---
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e1620);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const grid = new THREE.GridHelper(4000, 80, 0x2b3a4a, 0x1a2633); scene.add(grid);
// joki suunnilleen (y 500–620)
const joki = new THREE.Mesh(new THREE.PlaneGeometry(4000, 110).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x173a5c })); joki.position.set(0, -0.2, -560); scene.add(joki);

const S = { x: -120, y: 470, alt: 0, hp: 100, dead: 0 };
const WALK = { on: true, x: -120, y: 470, in: false, v: 0 };
const CAR = { x: 0, y: 0, type: 'estate', v: 0 };
window.__game = { scene, camera, renderer, S };
window.__walk = WALK; window.__car = CAR;

const pelaaja = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); scene.add(pelaaja);
const nokka = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); nokka.rotation.x = -Math.PI / 2; scene.add(nokka);

// paikkojen nimet
const paikat = await (await fetch('data/paikat.json')).json();
for (const [id, p] of Object.entries(paikat)) {
  if (id.startsWith('_')) continue;
  const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d');
  g.font = '600 30px system-ui, sans-serif'; g.fillStyle = p.keksitty ? '#c79bff' : '#9fd3ff'; g.fillText(p.nimi, 8, 42);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false })); sp.scale.set(64, 8, 1); sp.position.set(p.x + 30, 2, -p.y - 8); scene.add(sp);
  const pt = new THREE.Mesh(new THREE.CircleGeometry(2.2, 12).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: p.keksitty ? 0xc79bff : 0x9fd3ff })); pt.position.set(p.x, 0.1, -p.y); scene.add(pt);
}

const KULUT = ['jalan', 'auto', 'heli', 'pyora']; let ki = 0, yaw = 0;
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyV' && !e.ctrlKey) {
    const w = window.__tarina && window.__tarina.maailma(); const x = w ? w.x : WALK.x, y = w ? w.y : WALK.y;
    ki = (ki + 1) % KULUT.length; const k = KULUT[ki];
    WALK.on = k === 'jalan'; document.body.classList.toggle('car', k === 'auto' || k === 'pyora'); CAR.type = k === 'pyora' ? 'bike' : 'estate';
    WALK.x = CAR.x = S.x = x; WALK.y = CAR.y = S.y = y; S.dead = 0; S.hp = 100;
  }
  if (e.code === 'KeyB') { S.dead = 2; S.hp = 0; setTimeout(() => { S.dead = 0; S.hp = 100; }, 2200); }
});
addEventListener('keyup', e => keys.delete(e.code));

let edell = performance.now();
function kierros(nyt) {
  const dt = Math.min(0.1, (nyt - edell) / 1000); edell = nyt;
  const k = KULUT[ki], nop = { jalan: 6, auto: 25, heli: 40, pyora: 9 }[k] * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4 : 1);
  let dx = 0, dy = 0;
  if (keys.has('ArrowUp') || keys.has('KeyW')) dy += 1; if (keys.has('ArrowDown') || keys.has('KeyS')) dy -= 1;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) dx -= 1; if (keys.has('ArrowRight') || keys.has('KeyD')) dx += 1;
  const o = k === 'jalan' ? WALK : k === 'heli' ? S : CAR;
  if (dx || dy) { const l = Math.hypot(dx, dy); o.x += dx / l * nop * dt; o.y += dy / l * nop * dt; yaw = Math.atan2(dx, dy); }
  S.alt = k === 'heli' ? 30 : 0;
  pelaaja.position.set(o.x, 3 + S.alt, -o.y); pelaaja.material.color.set({ jalan: 0xffffff, auto: 0x4fc3f7, heli: 0xffb74d, pyora: 0x81c784 }[k]);
  nokka.position.set(o.x + Math.sin(yaw) * 7, 3 + S.alt, -o.y - Math.cos(yaw) * 7); nokka.rotation.set(-Math.PI / 2, 0, -yaw); nokka.material.color.copy(pelaaja.material.color);
  camera.position.set(o.x, 420, -o.y + 260); camera.lookAt(o.x, 0, -o.y);
  document.getElementById('tila').textContent = `${k}${S.dead > 0 ? ' (RIKKI)' : ''}  x ${o.x.toFixed(0)}  y ${o.y.toFixed(0)}`;
  renderer.render(scene, camera); requestAnimationFrame(kierros);
}
requestAnimationFrame(kierros);
await import('./peli.js');
</script>
</body>
</html>
