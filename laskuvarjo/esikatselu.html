<script type="module">

{ const cv = document.createElement('canvas'); cv.width = cv.height = 512; const g = cv.getContext('2d'); let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;      // maa: peltotilkkuja

const G = new THREE.Group(), pivot = new THREE.Group(), inner = new THREE.Group(), PIV = 1.22; scene.add(G); G.add(pivot); pivot.add(inner); inner.position.y = -PIV;      // G = rintakehän paikka, pivot = vartalon asento

// ---------- aikajana ----------
const PH = [[0, 'Ovella', 'Kone on hyppylinjalla noin 1 200 metrissä. Hyppääjä kyykyssä avoimella ovella: reppuvaljaat, kypärä, lasit ja korkeusmittari vasemmassa ranteessa.'],
  [3, 'Uloshyppy', 'Ponnistus ovelta ulos ja vartalo kaarelle. Ilmavirta kääntää hyppääjän vatsa maata kohti.'],
  [4.2, 'Vapaapudotus', 'Boksiasento: lantio alimpana, selkä kaarella, kädet ja jalat koukussa. Nopeus noin 190 km/h.'],
  [10, 'Avaus', 'Oikea käsi hakee apuvarjon kahvan repun alakulmasta ja heittää apuvarjon sivulle ilmavirtaan. Vasen käsi pään yläpuolelle tasapainoksi.'],
  [10.99, 'Avautuminen', 'Apuvarjo täyttyy ja kiristää yhdyspunoksen, sisäpussi nousee repusta, punokset purkautuvat suoriksi, kupu tulee pussista ja kennot täyttyvät. Liukuri valuu punoksia pitkin alas ja jarruttaa avautumista.'],
  [15.2, 'Kuvun alla', 'Kupu on auki ja liukuri alhaalla. Ohjauslenkit irrotetaan kantohihnoista: veto vasemmasta kääntää vasemmalle, oikeasta oikealle.'],
  [23, 'Loppulähestyminen', 'Vastatuuleen, kädet ylhäällä täydellä liidolla. Jalat yhdessä, katse horisontissa.'],
  [25, 'Loppuveto ja alastulo', 'Molemmat ohjauslenkit vedetään tasaisesti alas: kupu jarruttaa ja vajoaminen pysähtyy. Jalat ottavat vastaan, kupu kaatuu taakse.']];

  [15.4, [8, 0.5, 13.5], [0, 2.9, 0]], [22.9, [8, 0.5, 13.5], [0, 2.9, 0]], [23.0, [9, -0.2, 12], [0, 2.8, 0]], [26.2, [9.5, 0.4, 12.5], [0, 1.6, -1.5]], [29.5, [10, 0.8, 13], [0, 1.2, -2]]];
let orbit = null;
function state(t) {
  const w = {}, set = (n, k, tm) => { if (k > 0) w[n] = [k, tm]; };
  // animaatiot
  const pullT = seg(t, 10, 11.6), dep = seg(t, TD, TD + DDUR), opT = seg(t, TD + DDUR * 0.33, TD + DDUR * 0.33 + 2.4), land = seg(t, 26, 27.6);
  const turnL = ease(seg(t, 17, 17.7)) * (1 - ease(seg(t, 19, 19.7))), turnR = ease(seg(t, 20, 20.7)) * (1 - ease(seg(t, 22, 22.7))), flare = ease(seg(t, 25.0, 25.75));
  if (t < 3) set('JumpDoor', 1, t % 3);
  else if (t < 4.2) set('JumpExit', 1, Math.min(1.199, t - 3));
  else if (t < 10) set('Freefall', 1, (t - 4.2) % 2);
  else if (t < 11.6) set('Pull', 1, Math.min(1.599, t - 10));
  else if (opT <= 0) set('Freefall', 1, (t - 11.6) % 2);
  else if (opT < 1) set('Opening', 1, Math.min(2.399, opT * 2.4));
  else if (t < 26) { const c = Math.max(0, 1 - turnL - turnR - flare); set('Canopy', c, (t - 15) % 4); set('CanopyL', turnL, 0.5); set('CanopyR', turnR, 0.5); set('Flare', flare, 0.5); }
  else set('Land', 1, Math.min(1.599, (t - 26)));
  // korkeus (jalkojen korkeus maasta). Irti koneesta 3,42 s; 50 m/s kolmen sekunnin jälkeen; punokset suorina TO; leikkaus 23 s kohdalla loppulähestymiseen
  const TO = TD + 1.4, fall = f => f < 3 ? 4.6 * f * f : 41.4 + (f - 3) * 50, A0 = 1200 - fall(TO - 3.42); let alt;
  if (t < 3.42) alt = 1200; else if (t < TO) alt = 1200 - fall(t - 3.42);
  else if (t < 23) { const f = t - TO, k = Math.min(f, 2.2); alt = A0 - (50 * k - 45 * k * k / 4.4) - Math.max(0, f - 2.2) * 5; }      // kupu jarruttaa 50 -> 5 m/s

  return { w, alt, pitch, roll, dep, pc: t < 10 + 1.6 * 0.40 ? 'stowed' : t < TD ? 'hand' : 'out', bl: Math.max(turnL * 0.72, flare), br: Math.max(turnR * 0.72, flare), toggles: t > 15.6 && t < 26.7, collapse: ease(seg(t, 26.15, 28.7)), land };

  $('t').value = t;  let p = PH[0]; for (const q of PH) if (q[0] <= t) p = q; $('name').textContent = p[1]; $('desc').textContent = p[2]; $('clock').textContent = t.toFixed(1) + ' s · ' + Math.round(Math.max(0, G.position.y - PIV)) + ' m';
  document.querySelectorAll('#ph button').forEach(bn => bn.classList.toggle('on', bn.dataset.t == p[0]));

const fit = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }; addEventListener('resize', () => { fit(); apply(T); }); fit();
let T = 0, playing = true, last = performance.now();

let drag = null; $('c').addEventListener('pointerdown', e => { if (orbit) drag = [e.clientX, e.clientY]; }); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag || !orbit) return; orbit.az -= (e.clientX - drag[0]) * 0.008; orbit.el = Math.max(-1.3, Math.min(1.4, orbit.el + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; apply(T); });
